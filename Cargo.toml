[package]
name = "tether"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Keep a long-lived fork in step with its upstream. Agent-first, local, free."
repository = "https://github.com/Punit-Dethe/tether"
readme = "README.md"
keywords = ["git", "fork", "upstream", "merge", "agent"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = { version = "1.2.3", default-features = false, features = ["parse", "serde", "display"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
